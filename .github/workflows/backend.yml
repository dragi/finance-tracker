name: backend

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "infra/**"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "infra/**"
      - "requirements*.txt"
  workflow_dispatch:

env:
  STACK_NAME: expense-tracker
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint -t infra/template.yaml --region "$AWS_REGION"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for OIDC login to AWS
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sam build -t infra/template.yaml
      - run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides "AlertEmail=${{ secrets.ALERT_EMAIL }}"
