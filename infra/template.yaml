AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless expense tracker - database, API, backend functions and frontend hosting

Parameters:
  DbName:
    Type: String
    Default: expensetracker
  AlertEmail:
    Type: String
    Description: email address that receives budget-exceeded alerts

Globals:
  Function:
    Runtime: python3.12
    CodeUri: ../src/
    Timeout: 15
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
        DB_SECRET_ARN: !GetAtt DbCluster.MasterUserSecret.SecretArn
        DB_NAME: !Ref DbName

Resources:
  # --- database (Aurora Serverless v2, reached through the Data API) ---

  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    Properties:
      Engine: aurora-postgresql
      DatabaseName: !Ref DbName
      MasterUsername: expenseadmin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      StorageEncrypted: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql

  # lets a function run statements through the Data API and read the db secret
  DataApiAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
            Resource: !GetAtt DbCluster.DBClusterArn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn

  # --- auth (login only, users are created by hand in the console or cli) ---

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: expense-tracker-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: expense-tracker-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # --- api ---

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # --- functions ---

  CategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: categories.handler.handler
      Policies:
        - !Ref DataApiAccessPolicy
      Events:
        List:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /categories, Method: GET}
        Create:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /categories, Method: POST}
        Update:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/categories/{id}", Method: PUT}
        Delete:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/categories/{id}", Method: DELETE}

  AccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: accounts.handler.handler
      Policies:
        - !Ref DataApiAccessPolicy
      Events:
        List:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /accounts, Method: GET}

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transactions.handler.handler
      Policies:
        - !Ref DataApiAccessPolicy
      Events:
        List:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /transactions, Method: GET}
        Create:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /transactions, Method: POST}
        Update:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/transactions/{id}", Method: PUT}
        Delete:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/transactions/{id}", Method: DELETE}

  BudgetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: budgets.handler.handler
      Policies:
        - !Ref DataApiAccessPolicy
      Events:
        List:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /budgets, Method: GET}
        Create:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /budgets, Method: POST}
        Update:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/budgets/{id}", Method: PUT}
        Delete:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/budgets/{id}", Method: DELETE}

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: reports.handler.handler
      Policies:
        - !Ref DataApiAccessPolicy
      Events:
        Monthly:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /reports/monthly, Method: GET}

  # --- scheduled budget alerts ---

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: expense-tracker-budget-alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: alerts.check_budgets.handler
      Policies:
        - !Ref DataApiAccessPolicy
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertsTopic
      Events:
        DailyCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: checks budgets once a day and emails alerts for anything over

  # --- frontend hosting (private S3 bucket served through CloudFront) ---

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-bucket
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed CachingOptimized
        # send unknown paths back to index.html so react-router can handle them
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DbClusterArn:
    Value: !GetAtt DbCluster.DBClusterArn
  DbSecretArn:
    Value: !GetAtt DbCluster.MasterUserSecret.SecretArn
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
